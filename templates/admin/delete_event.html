{% extends 'admin/adminbase.html' %}
{% block title %}Delete Event{% endblock %}

{% block content %}
<div class="container mt-4">

  <div class="dark-card shadow-lg text-center">

    <!-- Header -->
    <h4 class="fw-bold text-danger mb-3">
      <i class="fas fa-trash-alt"></i> Delete Event
    </h4>

    <hr class="border-secondary">

    <p class="lead text-light">Are you sure you want to delete:</p>

    <h3 class="text-info mb-4">{{ event.title }}</h3>

    <form method="POST">
      {% csrf_token %}

      <button class="btn btn-danger fw-bold px-4 me-2">
        <i class="fas fa-exclamation-triangle"></i> Yes, Delete
      </button>

      <a href="{% url 'event_list' %}"
         class="btn btn-secondary text-light px-4">
        <i class="fas fa-arrow-left"></i> Cancel
      </a>
    </form>

  </div>

</div>
{% endblock %}
