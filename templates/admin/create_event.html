{% extends 'admin/adminbase.html' %}
{% block title %}Create Event{% endblock %}

{% block extra_css %}
<style>
  .create-event-shell {
    max-width: 980px;
    margin: 0 auto;
  }

  .create-event-header {
    margin-bottom: 1.75rem;
  }

  .create-event-title {
    font-size: clamp(1.95rem, 3.1vw, 2.6rem);
    font-weight: 800;
    color: #111;
    margin-bottom: 0.35rem;
  }

  .create-event-subtitle {
    color: #666;
    margin: 0;
  }

  .event-form-shell {
    background: #fff;
    border: 1px solid #e7e7e7;
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.07);
    padding: 1.35rem;
  }

  .event-form-section {
    background: #fff;
    border: 1px solid #ececec;
    border-radius: 14px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
    padding: 1.2rem 1.15rem;
    margin-bottom: 1.2rem;
  }

  .event-form-section-title {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #303030;
    margin-bottom: 1rem;
  }

  .event-label {
    font-size: 0.84rem;
    font-weight: 700;
    color: #525252;
    margin-bottom: 0.45rem;
  }

  .event-control {
    min-height: 48px;
    border-radius: 10px !important;
    border: 1px solid #d8d8d8 !important;
    background: #fff !important;
    color: #111 !important;
    padding: 0.6rem 0.75rem;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
  }

  textarea.event-control {
    min-height: 120px;
  }

  .event-control:focus {
    border-color: #1d4ed8 !important;
    box-shadow: 0 0 0 0.2rem rgba(29, 78, 216, 0.14) !important;
    background-color: #fff !important;
  }

  .create-submit-btn {
    width: 100%;
    min-height: 52px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 800;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .create-submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 24px rgba(0, 0, 0, 0.15);
  }

  @media (min-width: 992px) {
    .event-form-shell {
      padding: 1.55rem;
    }

    .event-form-section {
      padding: 1.35rem;
      margin-bottom: 1.35rem;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="py-4 py-lg-5 create-event-shell">
  <div class="create-event-header">
    <h1 class="create-event-title"><i class="fas fa-calendar-plus me-2"></i>Create New Event</h1>
    <p class="create-event-subtitle">Fill in details to create an event.</p>
  </div>

  <div class="event-form-shell">
    <form action="" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="event-form-section">
        <h3 class="event-form-section-title"><i class="fas fa-pen-nib"></i> Basic Information</h3>
        <div class="mb-3">
          <label class="form-label event-label">Event Title</label>
          <input type="text" name="title" class="form-control event-control" required>
        </div>
        <div class="mb-0">
          <label class="form-label event-label">Description</label>
          <textarea name="description" class="form-control event-control" rows="4" required></textarea>
        </div>
      </div>

      <div class="event-form-section">
        <h3 class="event-form-section-title"><i class="fas fa-calendar-alt"></i> Schedule</h3>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label event-label">Date</label>
            <input type="date" name="date" class="form-control event-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label event-label">Time</label>
            <input type="time" name="time" class="form-control event-control" required>
          </div>
        </div>
      </div>

      <div class="event-form-section">
        <h3 class="event-form-section-title"><i class="fas fa-map-marker-alt"></i> Location</h3>
        <div class="mb-0">
          <label class="form-label event-label">Venue</label>
          <input type="text" name="venue" class="form-control event-control" required>
        </div>
      </div>

      <div class="event-form-section">
        <h3 class="event-form-section-title"><i class="fas fa-coins"></i> Pricing</h3>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label event-label">Currency</label>
            <select id="currencySelect" class="form-control event-control">
              <option value="ETH">ETH (Default)</option>
              <option value="USD">USD - US Dollar</option>
              <option value="INR">INR - Indian Rupees</option>
              <option value="EUR">EUR - Euro</option>
              <option value="AED">AED - UAE Dirham</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label event-label">Enter Price</label>
            <input type="number" id="inputPrice" class="form-control event-control" step="0.01" placeholder="Enter amount" required>
          </div>

          <div class="col-md-4">
            <label class="form-label event-label">Price in ETH</label>
            <input type="number" id="ethPrice" name="price" class="form-control event-control" step="0.000001" readonly required>
          </div>
        </div>
      </div>

      <div class="event-form-section">
        <h3 class="event-form-section-title"><i class="fas fa-ticket-alt"></i> Ticket Details</h3>
        <div class="mb-0">
          <label class="form-label event-label">Total Tickets</label>
          <input type="number" name="total_tickets" class="form-control event-control" required>
        </div>
      </div>

      <div class="event-form-section">
        <h3 class="event-form-section-title"><i class="fas fa-cloud-upload-alt"></i> Upload</h3>
        <div class="mb-0">
          <label class="form-label event-label">Event Poster</label>
          <input type="file" name="poster" class="form-control event-control" required>
        </div>
      </div>

      <button class="btn btn-info text-white create-submit-btn mt-2">
        <i class="fas fa-save"></i> Create Event
      </button>
    </form>
  </div>
</div>

<!-- JS: Currency Conversion -->
<script>
  const currencyRates = {
      "USD": 0.00025, 
      "INR": 0.0000030,
      "EUR": 0.00027,
      "AED": 0.000068,
      "ETH": 1
  };

  const currencySelect = document.getElementById("currencySelect");
  const inputPrice = document.getElementById("inputPrice");
  const ethPrice = document.getElementById("ethPrice");

  function convertToETH() {
      let currency = currencySelect.value;
      let amount = parseFloat(inputPrice.value);

      if (!amount || amount <= 0) {
          ethPrice.value = "";
          return;
      }

      let ethValue = amount * currencyRates[currency];
      ethPrice.value = ethValue.toFixed(6);
  }

  currencySelect.addEventListener("change", convertToETH);
  inputPrice.addEventListener("input", convertToETH);
</script>

{% endblock %}
